# Data Catalog — all I/O lives here, never inside a node.
# Swapping CSV for Parquet, or local disk for S3, is a change to this file only.
# Layers follow the Kedro data-engineering convention: raw -> intermediate ->
# primary -> feature -> model_input -> model_output / reporting.
#
# Datasets used by a pipeline but absent from this file (the refit
# intermediates, e.g. refit_imputed_data) are kept in memory by Kedro.

# ---------------------------------------------------------------- raw (01)
raw_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/diabetes-dataset-modelling.csv
  metadata:
    kedro-viz:
      layer: raw

raw_inference_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/diabetes-dataset-inference.csv
  metadata:
    kedro-viz:
      layer: raw

# Injection point for online inference: an API can replace this entry with a
# MemoryDataset holding the request payload and run the very same pipeline.
raw_inference_dataframe:
  type: MemoryDataset

# ------------------------------------------------------- intermediate (02)
cleaned_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/cleaned_diabetes-modelling.csv
  save_args:
    index: false
  metadata:
    kedro-viz:
      layer: intermediate

cleaned_inference_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/cleaned_diabetes-inference.csv
  save_args:
