# ---------------------------------------------------------- models (06)
# No layer here on purpose: these fit artefacts are produced from one layer and
# consumed to build another, so tagging them would make kedro-viz see a cycle
# between layers and switch layer visualisation off.
modelling_imputers:
  type: pickle.PickleDataset
  filepath: data/06_models/modelling_imputers.pkl

modelling_outlier_caps:
  type: pickle.PickleDataset
  filepath: data/06_models/modelling_outlier_caps.pkl

modelling_encoders:
  type: pickle.PickleDataset
  filepath: data/06_models/modelling_encoders.pkl

modelling_scalers:
