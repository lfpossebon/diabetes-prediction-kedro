# Every column list, split proportion, threshold and hyperparameter lives here.
# Changing the model, the grid or the feature set never requires touching src/.

# Column groups, referenced by group key throughout the pipelines.
columns:
  target: Outcome
  # The eight clinical measurements exactly as they arrive in the raw CSV.
  raw:
    - Pregnancies
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI
    - DiabetesPedigreeFunction
    - Age
  # A zero here is physiologically impossible: it is how the dataset encodes
  # "not measured". Pregnancies = 0 is a real value and stays out of this list.
  zero_as_missing:
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI
  # Missing so often that the gap itself carries information (Insulin ~48%,
  # SkinThickness ~29%): each gets a 0/1 <COL>_MISSING flag before imputation.
  missing_indicator:
    - SkinThickness
    - Insulin
  # Scaled with RobustScaler: the raw measurements plus the two interactions
  # built by create_features. The model features are every master-table column
  # (these, the one-hot categories and the missing flags).
  numerical:
    - Pregnancies
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI
    - DiabetesPedigreeFunction
    - Age
    - GLUCOSE_X_INSULIN
    - GLUCOSE_X_PREGNANCIES
  # Nominal categories built by create_features, all of them one-hot encoded.
  categorical:
    - NEW_AGE_CAT
    - NEW_BMI
    - NEW_GLUCOSE
    - NEW_AGE_BMI_NOM
    - NEW_AGE_GLUCOSE_NOM
    - NEW_INSULIN_SCORE

split:
  train: 0.7
  test: 0.15
  validate: 0.15
  random_state: 42
  # Every split keeps the dataset's diabetes prevalence (~35%).
  stratify_by: Outcome

# Outlier thresholds: the notebook's wide IQR, (q95 - q05) * 1.5 beyond each quantile.
# Kept for parity with the notebook, but on this data it is almost a no-op: the
# lower limits are negative and only a handful of Insulin values reach the upper
# one. Tighter caps (q1: 0.25, q3: 0.75) are a one-line change here.
outliers:
  q1: 0.05
  q3: 0.95
  iqr_factor: 1.5

# Clinical cut-offs used by create_features. Upper bins are open-ended (1000),
# so an out-of-range value sent to the API still lands in the last category.
feature_engineering:
  senior_age: 50
  bmi:
    bins: [0, 18.5, 24.9, 29.9, 1000]
    labels: [Underweight, Healthy, Overweight, Obese]
  glucose:
    bins: [0, 140, 200, 1000]
    labels: [Normal, Prediabetes, Diabetes]
  # Fasting glucose levels, left-closed: [0, 70) low, [70, 100) normal ...
  glucose_level:
    bins: [0, 70, 100, 126, 1000]
    labels: [low, normal, hidden, high]
  insulin_normal_range: [16, 166]

# --- data engineering: fit on the train split only, to avoid leakage -------
modelling_imputers:
  columns: [raw]
  strategy: median
  split_to_fit: [train]

modelling_outlier_caps:
  columns: [raw]
  split_to_fit: [train]

modelling_encoders:
  columns: [categorical]
  split_to_fit: [train]

modelling_scalers:
  columns: [numerical]
  split_to_fit: [train]

# --- modelling -------------------------------------------------------------
modelling_baseline:
  class_path: sklearn.linear_model.LogisticRegression
  target_column: Outcome
  train_splits: [train]
  eval_splits: [train, test, validate]
  init_args:
    max_iter: 1000

# The notebook's best model after tuning, with the notebook's grid. The search
# runs on train + test; validate stays untouched for an honest final score.
# Scoring test would only repeat an in-sample number, so it is left out.
modelling_optimization:
  class_path: sklearn.ensemble.RandomForestClassifier
  target_column: Outcome
  train_splits: [train, test]
  eval_splits: [train, validate]
  init_args:
    random_state: 46
  cv: 5
  scoring: roc_auc
  n_jobs: -1  # parallel grid search; -1 = every core
  param_grid:
    n_estimators: [100, 200, 300]
    max_depth: [null, 5, 10]
    min_samples_split: [2, 5, 10]

# Bootstrap confidence interval reported next to every ROC AUC.
evaluation:
  n_bootstrap: 1000
  confidence: 0.95
  random_state: 42

# The tuned model replaces the baseline only if it beats it on the untouched
# validate split by more than min_improvement. A tie keeps the baseline:
# simpler, smaller and interpretable.
champion_selection:
  split: validate
  metric: roc_auc
  min_improvement: 0.0

# Out-of-fold trade-off curve for the champion, written to
# 08_reporting/threshold_curve.json: the evidence behind decision.threshold.
threshold_analysis:
  cv: 5
  random_state: 42
  thresholds: [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]

# --- decision: the business cut-off, shared by evaluation and inference ----
# A patient is flagged (prediction = 1) when P(diabetes) >= threshold.
# Missing a diabetic patient costs far more than one extra blood test, so the
# cut-off sits below the default 0.5. Chosen from out-of-fold predictions on
# the modelling data only (08_reporting/threshold_curve.json): going from 0.5
# to 0.35, recall rises from 0.55 to 0.81 while 45% of the patients, instead
# of 29%, are sent to the confirmatory test.
decision:
  threshold: 0.35

# --- refit: same functions, every split, production artefacts --------------
refit_imputers:
  columns: [raw]
  strategy: median
  split_to_fit: [train, test, validate]

refit_outlier_caps:
  columns: [raw]
  split_to_fit: [train, test, validate]

refit_encoders:
  columns: [categorical]
  split_to_fit: [train, test, validate]

refit_scalers:
  columns: [numerical]
  split_to_fit: [train, test, validate]

refit_model:
  train_splits: [train, test, validate]
